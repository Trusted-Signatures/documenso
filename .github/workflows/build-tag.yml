name: Build Specific Tag

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to build (e.g., v1.6.2-ts.1)'
        required: true
        type: string

jobs:
  build_and_publish:
    name: Build and publish multi-arch container
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}
          fetch-tags: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-arch image
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          GIT_SHA="$(git rev-parse HEAD)"

          # Retry up to 3 times on failure
          for i in 1 2 3; do
            if docker buildx build \
              --platform linux/amd64,linux/arm64 \
              -f ./docker/Dockerfile \
              --progress=plain \
              -t "trustedsignatures/documenso:$TAG_NAME" \
              -t "trustedsignatures/documenso:$GIT_SHA" \
              --push \
              .; then
              echo "Build succeeded on attempt $i"
              break
            else
              if [ $i -eq 3 ]; then
                echo "Build failed after 3 attempts"
                exit 1
              fi
              echo "Build failed on attempt $i, retrying..."
              sleep 30
            fi
          done

      - name: Determine tag channel
        id: tag_channel
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail

          if echo "$TAG_NAME" | grep -Eq 'rc|beta|alpha'; then
            echo "is_stable=false" >> "$GITHUB_OUTPUT"
            echo "is_latest_stable=false" >> "$GITHUB_OUTPUT"
            echo "is_rc=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! command -v jq >/dev/null 2>&1; then
            echo "jq not found, attempting install..."
            sudo apt-get update && sudo apt-get install -y jq || true
          fi

          RELEASES_API_URL="https://api.github.com/repos/${{ github.repository }}/releases?per_page=100"
          RELEASES_JSON="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            "${RELEASES_API_URL}")"

          mapfile -t STABLE_TS_TAGS < <(
            if command -v jq >/dev/null 2>&1; then
              printf '%s' "${RELEASES_JSON}" \
                | jq -r '.[] | select(.draft == false and .prerelease == false) | .tag_name' \
                | awk '/^v.*-ts\./' \
                | sort -V
            else
              printf '%s' "${RELEASES_JSON}" \
                | node -e "const fs=require('fs');const releases=JSON.parse(fs.readFileSync(0,'utf8'));const tags=releases.map(r=>({t:r.tag_name,d:r.draft,p:r.prerelease})).filter(x=>!x.d&&!x.p&&typeof x.t==='string'&&/^v.*-ts\\./.test(x.t)).map(x=>x.t);tags.sort((a,b)=>a.localeCompare(b,undefined,{numeric:true,sensitivity:'base'}));for(const t of tags)console.log(t);"
            fi
          )

          if [ ${#STABLE_TS_TAGS[@]} -eq 0 ]; then
            echo "No stable TS tags found; skipping latest alias update."
            echo "is_stable=true" >> "$GITHUB_OUTPUT"
            echo "is_latest_stable=false" >> "$GITHUB_OUTPUT"
            echo "is_rc=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LATEST_STABLE_TAG="$(printf '%s\n' "${STABLE_TS_TAGS[@]}" | tail -n 1)"
          echo "latest_stable_tag=${LATEST_STABLE_TAG}" >> "$GITHUB_OUTPUT"
          echo "is_stable=true" >> "$GITHUB_OUTPUT"
          echo "is_rc=false" >> "$GITHUB_OUTPUT"

          if [ "$TAG_NAME" = "$LATEST_STABLE_TAG" ]; then
            echo "is_latest_stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest_stable=false" >> "$GITHUB_OUTPUT"
            echo "Current tag ${TAG_NAME} is not latest stable tag ${LATEST_STABLE_TAG}; skipping latest alias."
          fi

      - name: Tag latest for stable releases
        if: ${{ steps.tag_channel.outputs.is_latest_stable == 'true' }}
        run: |
          docker buildx imagetools create \
            -t trustedsignatures/documenso:latest \
            trustedsignatures/documenso:${{ inputs.tag_name }}

      - name: Tag rc for release candidates
        if: ${{ steps.tag_channel.outputs.is_rc == 'true' }}
        run: |
          docker buildx imagetools create \
            -t trustedsignatures/documenso:rc \
            trustedsignatures/documenso:${{ inputs.tag_name }}
