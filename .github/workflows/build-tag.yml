name: Build Specific Tag

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to build (e.g., v1.6.2-ts.1)'
        required: true
        type: string

jobs:
  build_and_publish:
    name: Build and publish multi-arch container
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}
          fetch-tags: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-arch image
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          GIT_SHA="$(git rev-parse HEAD)"

          # Retry up to 3 times on failure
          for i in 1 2 3; do
            if docker buildx build \
              --platform linux/amd64,linux/arm64 \
              -f ./docker/Dockerfile \
              --progress=plain \
              -t "trustedsignatures/documenso:$TAG_NAME" \
              -t "trustedsignatures/documenso:$GIT_SHA" \
              --push \
              .; then
              echo "Build succeeded on attempt $i"
              break
            else
              if [ $i -eq 3 ]; then
                echo "Build failed after 3 attempts"
                exit 1
              fi
              echo "Build failed on attempt $i, retrying..."
              sleep 30
            fi
          done

      - name: Tag latest for stable releases
        if: ${{ !contains(inputs.tag_name, 'rc') && !contains(inputs.tag_name, 'beta') }}
        run: |
          docker buildx imagetools create \
            -t trustedsignatures/documenso:latest \
            trustedsignatures/documenso:${{ inputs.tag_name }}

      - name: Tag rc for release candidates
        if: contains(inputs.tag_name, 'rc')
        run: |
          docker buildx imagetools create \
            -t trustedsignatures/documenso:rc \
            trustedsignatures/documenso:${{ inputs.tag_name }}
