name: Track upstream releases and rebase/apply TS changes

on:
  workflow_dispatch: {}
  schedule:
    - cron: '17 7 * * *' # daily 07:17 UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up git identity
        run: |
          git config user.name  "actions-bot"
          git config user.email "actions-bot@users.noreply.github.com"

      - name: Add upstream remote and fetch tags
        run: |
          git remote add upstream https://github.com/documenso/documenso.git || true
          git fetch upstream --tags --prune

      - name: Show latest upstream tags
        run: |
          echo "Latest upstream tags:"
          git tag -l --sort=-creatordate | head -n 20

      - name: Prepare patches (patch mode)
        if: env.PATCH_MODE == '1'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ts_patches"
          shopt -s nullglob
          # copy your repo's patches into a temp location outside the git worktree
          cp -v patches/*.patch "$RUNNER_TEMP/ts_patches/" || {
            echo "::error::No patch files found in patches/"; exit 1;
          }
          echo "PATCH_GLOB=$RUNNER_TEMP/ts_patches/*.patch" >> "$GITHUB_ENV"

      - name: Run tracker
        id: run
        shell: bash
        env:
          PATCH_MODE: '1' # you're in patch mode
        run: |
          set -euo pipefail

          TS_SUFFIX="-ts.1"
          PATCH_MODE="${PATCH_MODE:-0}"
          # Prefer the value exported by the prep step; otherwise fall back to repo path.
          PATCH_GLOB="${PATCH_GLOB:-}"
          if [ -z "${PATCH_GLOB}" ] && [ -d "$RUNNER_TEMP/ts_patches" ]; then
            PATCH_GLOB="$RUNNER_TEMP/ts_patches/*.patch"
          fi
          : "${PATCH_GLOB:=patches/*.patch}"
          echo "Using PATCH_GLOB=$PATCH_GLOB"

          git remote add upstream https://github.com/documenso/documenso.git 2>/dev/null || true
          git fetch upstream --tags --prune

          if [ "$PATCH_MODE" != "1" ]; then
            if ! git rev-parse --verify ts/patches >/dev/null 2>&1; then
              echo "::error::Missing branch ts/patches (create it with your commits)."
              exit 1
            fi
            git fetch upstream main
            BASE=$(git merge-base ts/patches upstream/main)
            COMMITS=$(git rev-list --reverse "${BASE}..ts/patches" || true)
          else
            ls $PATCH_GLOB >/dev/null 2>&1 || { echo "::error::No patch files found via PATCH_GLOB=$PATCH_GLOB"; exit 1; }
          fi

          NEW_TAGS=0
          for TAG in $(git for-each-ref --sort=creatordate --format='%(refname:short)' refs/tags | grep -E '^v[0-9]'); do
            OUT_TAG="${TAG}${TS_SUFFIX}"
            if git rev-parse -q --verify "refs/tags/${OUT_TAG}" >/dev/null; then
              echo "Already processed: ${OUT_TAG}"
              continue
            fi

            echo "==> Processing ${TAG}"
            git switch --discard-changes --detach "${TAG}"
            WORKBR="release/${TAG}-ts"
            git switch -c "${WORKBR}" || git switch "${WORKBR}"

            CONFLICT=0
            if [ "$PATCH_MODE" = "1" ]; then
              echo "Applying patches from ${PATCH_GLOB}"
              if ! git am -3 --keep-cr $PATCH_GLOB; then
                CONFLICT=1; git am --abort || true
              fi
            else
              echo "Cherry-picking TS commits onto ${TAG}"
              for C in ${COMMITS}; do
                if ! git cherry-pick -x --allow-empty "${C}"; then
                  CONFLICT=1; git cherry-pick --abort || true; break
                fi
              done
            fi

            if [ "${CONFLICT}" = "1" ]; then
              echo "Conflicts for ${TAG}; pushing branch."
              git push origin "${WORKBR}:${WORKBR}"
              echo "tag=${TAG}"           >> $GITHUB_OUTPUT
              echo "branch=${WORKBR}"     >> $GITHUB_OUTPUT
              echo "status=conflict"      >> $GITHUB_OUTPUT
              exit 0
            fi

            git tag "${OUT_TAG}"
            git push origin "${WORKBR}:${WORKBR}"
            git push origin "refs/tags/${OUT_TAG}"
            echo "last_tag=${OUT_TAG}" >> $GITHUB_OUTPUT
            echo "branch=${WORKBR}"    >> $GITHUB_OUTPUT
            echo "status=ok"           >> $GITHUB_OUTPUT
            NEW_TAGS=$((NEW_TAGS+1))
          done

          echo "new_count=${NEW_TAGS}" >> $GITHUB_OUTPUT

      - name: Create PR when conflicts occur
        if: steps.run.outputs.status == 'conflict'
        uses: actions/github-script@v7
        env:
          TAG: ${{ steps.run.outputs.conflict_tag }}
          BRANCH: ${{ steps.run.outputs.conflict_branch }}
        with:
          script: |
            const tag   = process.env.TAG;
            const br    = process.env.BRANCH;
            const { owner, repo } = context.repo;

            // If there isn't already an open PR from this branch, create one.
            const prs = await github.rest.pulls.list({
              owner, repo, state: 'open', head: `${owner}:${br}`
            });
            if (prs.data.length === 0) {
              await github.rest.pulls.create({
                owner, repo,
                title: `Resolve conflicts for ${tag}`,
                head: br,
                base: 'main',
                body: `Automated rebase/apply onto upstream tag \`${tag}\` hit conflicts. Please resolve on \`${br}\`.`
              });
            } else {
              core.info(`PR already exists for ${br}`);
            }

      - name: Create GitHub Releases and trigger publish workflows
        if: steps.run.outputs.status == 'ok' && steps.run.outputs.new_count > 0
        uses: actions/github-script@v7
        env:
          SUCCESSFUL_RELEASES: ${{ steps.run.outputs.successful_releases }}
        with:
          script: |
            const releases = process.env.SUCCESSFUL_RELEASES.trim().split('\n').filter(line => line);
            const { owner, repo } = context.repo;

            for (const release of releases) {
              const [tagName, branch] = release.split(':');
              if (!tagName || !branch) continue;

              try {
                // Check if release already exists
                await github.rest.repos.getReleaseByTag({ owner, repo, tag: tagName });
                core.info(`Release for ${tagName} already exists.`);
              } catch (e) {
                // Create a new release
                await github.rest.repos.createRelease({
                  owner, repo,
                  tag_name: tagName,
                  target_commitish: branch,
                  name: tagName,
                  body: `Automated Trusted Signatures release based on upstream ${tagName.replace(/-ts.*$/, '')}`,
                  draft: false,
                  prerelease: false
                });
                core.info(`Created release ${tagName}`);
              }

              // Trigger publish workflow for this release
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner, repo,
                  workflow_id: 'publish.yml',
                  ref: branch
                });
                core.info(`Triggered publish workflow for ${tagName}`);
              } catch (e) {
                core.error(`Failed to trigger publish workflow for ${tagName}: ${e.message}`);
              }
            }
