name: Track upstream releases and rebase/apply TS changes

on:
  workflow_dispatch: {}
  schedule:
    - cron: '17 7 * * *' # daily 07:17 UTC

permissions:
  contents: write
  pull-requests: write
  actions: write

env:
  PATCH_MODE: '1' # run in patch mode by default

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN || github.token }}

      - name: Set up git identity
        run: |
          git config user.name  "actions-bot"
          git config user.email "actions-bot@users.noreply.github.com"

      - name: Add upstream remote and fetch tags
        run: |
          git remote add upstream https://github.com/documenso/documenso.git || true
          git fetch upstream --tags --prune

      - name: Show latest upstream tags
        run: |
          echo "Latest upstream tags:"
          git tag -l --sort=-creatordate | head -n 20

      - name: Prepare patches (patch mode)
        if: env.PATCH_MODE == '1'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ts_patches"
          shopt -s nullglob
          # copy your repo's patches into a temp location outside the git worktree
          cp -v patches/*.patch "$RUNNER_TEMP/ts_patches/" || {
            echo "::error::No patch files found in patches/"; exit 1;
          }
          echo "PATCH_GLOB=$RUNNER_TEMP/ts_patches/*.patch" >> "$GITHUB_ENV"

      - name: Run tracker (PATCH MODE ONLY)
        id: run
        shell: bash
        run: |
          set -euo pipefail

          # ---- config ----
          TS_SUFFIX="${TS_SUFFIX:-"-ts.1"}"

          # Prefer patches prepared into $RUNNER_TEMP/ts_patches; else use repo path
          PATCH_GLOB="${PATCH_GLOB:-}"
          if [ -z "${PATCH_GLOB}" ]; then
            if [ -d "$RUNNER_TEMP/ts_patches" ]; then
              PATCH_GLOB="$RUNNER_TEMP/ts_patches/*.patch"
            else
              PATCH_GLOB="patches/*.patch"
            fi
          fi
          echo "Using PATCH_GLOB=$PATCH_GLOB"

          # Collect patches into an array (handles spaces safely)
          shopt -s nullglob
          PATCHES=( $PATCH_GLOB )
          if [ ${#PATCHES[@]} -eq 0 ]; then
            echo "::error::No patch files found via PATCH_GLOB=$PATCH_GLOB"
            exit 1
          fi
          echo "Patches:"
          for f in "${PATCHES[@]}"; do echo " - $f"; done

          # ---- fetch upstream tags ----
          git remote add upstream https://github.com/documenso/documenso.git 2>/dev/null || true
          git fetch upstream --tags --prune

          NEW_TAGS=0
          SUCCESSFUL_RELEASES=""

          # Build the candidate list from upstream releases (not just tags).
          if ! command -v jq >/dev/null 2>&1; then
            echo "jq not found, attempting install..."
            sudo apt-get update && sudo apt-get install -y jq || true
          fi

          RELEASES_API_URL="https://api.github.com/repos/documenso/documenso/releases?per_page=100"
          RELEASES_JSON="$(curl -fsSL -H "Accept: application/vnd.github+json" "${RELEASES_API_URL}")"

          mapfile -t RELEASED_UPSTREAM_TAGS < <(
            if command -v jq >/dev/null 2>&1; then
              printf '%s' "${RELEASES_JSON}" \
                | jq -r '.[] | select(.draft == false) | .tag_name' \
                | awk 'NF'
            else
              printf '%s' "${RELEASES_JSON}" \
                | node -e "const fs=require('fs');const releases=JSON.parse(fs.readFileSync(0,'utf8'));for(const r of releases){if(!r.draft&&typeof r.tag_name==='string'&&r.tag_name.length>0)console.log(r.tag_name);}"
            fi
          )

          if [ ${#RELEASED_UPSTREAM_TAGS[@]} -eq 0 ]; then
            echo "No released upstream tags found to process."
          fi

          mapfile -t CANDIDATE_TAGS < <(
            printf '%s\n' "${RELEASED_UPSTREAM_TAGS[@]}" \
              | awk '/^v/ && !/-ts\./' \
              | while read -r RELEASE_TAG; do
                  if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
                    echo "${RELEASE_TAG}"
                  fi
                done \
              | sort -Vr \
              | head -n 10
          )

          if [ ${#CANDIDATE_TAGS[@]} -eq 0 ]; then
            echo "No upstream release tags found to process."
          fi

          has_ts_markers() {
            local markers=0

            if [ -f "packages/signing/transports/trusted-signatures.ts" ]; then
              markers=$((markers + 1))
            fi

            if [ -f "packages/signing/index.ts" ] && grep -q "trusted-signatures" "packages/signing/index.ts"; then
              markers=$((markers + 1))
            fi

            if [ -f ".env.example" ] && grep -q "NEXT_PRIVATE_SIGNING_TS_API_KEY" ".env.example"; then
              markers=$((markers + 1))
            fi

            [ "$markers" -ge 2 ]
          }

          for TAG in "${CANDIDATE_TAGS[@]}"; do
            OUT_TAG="${TAG}${TS_SUFFIX}"
            UPSTREAM_SHA="$(git ls-remote --tags --refs upstream "refs/tags/${TAG}" | awk '{print $1}')"
            if [ -z "${UPSTREAM_SHA}" ]; then
              echo "Could not resolve upstream SHA for ${TAG}, skipping."
              continue
            fi

            if git rev-parse -q --verify "refs/tags/${OUT_TAG}" >/dev/null; then
              echo "Already processed: ${OUT_TAG}"
              continue
            fi

            echo "==> Processing ${TAG} (${UPSTREAM_SHA})"
            git switch --discard-changes --detach "${UPSTREAM_SHA}"

            WORKBR="release/${TAG}-ts"
            if git rev-parse -q --verify "${WORKBR}" >/dev/null; then
              git switch "${WORKBR}"
              git reset --hard "${UPSTREAM_SHA}"
            else
              git switch -c "${WORKBR}"
            fi

            if has_ts_markers; then
              echo "Trusted Signatures markers already present on ${TAG}; skipping patch apply."
            else

              # Apply patch series:
              # - mbox patches -> git am -3
              # - unified diff patches -> git apply --3way --index + manual commit
              CONFLICT=0
              for PATCH in "${PATCHES[@]}"; do
                if head -n 1 "$PATCH" | grep -qE '^From [0-9a-f]{40} '; then
                  if git am -3 --keep-cr "$PATCH" 2>/dev/null; then
                    echo "Applied patch (git am): $PATCH"
                    continue
                  fi
                else
                  if git apply --3way --index "$PATCH" 2>/dev/null; then
                    git commit -m "Add Trusted Signatures support

                    Applied from patch: $(basename "$PATCH")"
                    echo "Applied patch (git apply --3way): $PATCH"
                    continue
                  fi
                fi

                if has_ts_markers; then
                  echo "Trusted Signatures markers detected after apply attempt on ${TAG}; continuing."
                  CONFLICT=0
                  break
                fi

                echo "Patch conflict on ${TAG} with $PATCH"
                echo "Patch diagnostics:"
                git apply --check --verbose "$PATCH" || true
                git status --short || true
                CONFLICT=1
                break
              done

              if [ "$CONFLICT" = "1" ]; then
                git am --abort 2>/dev/null || true
                git reset --hard "${UPSTREAM_SHA}" || true
                git clean -fd || true
                git push origin "${WORKBR}:${WORKBR}"
                echo "tag=${TAG}"        >> "$GITHUB_OUTPUT"
                echo "branch=${WORKBR}"  >> "$GITHUB_OUTPUT"
                echo "status=conflict"   >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi

            # Tag + push
            git tag "${OUT_TAG}"
            git push origin "${WORKBR}:${WORKBR}"
            git push origin "refs/tags/${OUT_TAG}"

            echo "Successfully processed: ${OUT_TAG}"
            SUCCESSFUL_RELEASES="${SUCCESSFUL_RELEASES}${OUT_TAG}:${WORKBR}\n"
            NEW_TAGS=$((NEW_TAGS+1))
          done

          echo "new_count=${NEW_TAGS}" >> "$GITHUB_OUTPUT"
          echo "successful_releases<<EOF" >> "$GITHUB_OUTPUT"
          echo -e "${SUCCESSFUL_RELEASES}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "status=ok" >> "$GITHUB_OUTPUT"

      - name: Create PR when conflicts occur
        if: steps.run.outputs.status == 'conflict' && steps.run.outputs.tag != '' && steps.run.outputs.branch != ''
        uses: actions/github-script@v7
        env:
          TAG: ${{ steps.run.outputs.tag }}
          BRANCH: ${{ steps.run.outputs.branch }}
        with:
          script: |
            const tag = process.env.TAG?.trim();
            const br = process.env.BRANCH?.trim();
            const { owner, repo } = context.repo;

            if (!tag || !br) {
              core.setFailed(`Missing conflict context (TAG='${tag}', BRANCH='${br}')`);
              return;
            }

            // If there isn't already an open PR from this branch, create one.
            const prs = await github.rest.pulls.list({
              owner, repo, state: 'open', head: `${owner}:${br}`
            });
            if (prs.data.length === 0) {
              await github.rest.pulls.create({
                owner, repo,
                title: `Resolve conflicts for ${tag}`,
                head: br,
                base: 'main',
                body: `Automated rebase/apply onto upstream tag \`${tag}\` hit conflicts. Please resolve on \`${br}\`.`
              });
            } else {
              core.info(`PR already exists for ${br}`);
            }

      - name: Create GitHub Releases and trigger publish workflows
        if: steps.run.outputs.status == 'ok' && steps.run.outputs.new_count > 0
        uses: actions/github-script@v7
        env:
          SUCCESSFUL_RELEASES: ${{ steps.run.outputs.successful_releases }}
        with:
          script: |
            const releases = process.env.SUCCESSFUL_RELEASES.trim().split('\n').filter(line => line);
            const { owner, repo } = context.repo;

            for (const release of releases) {
              const [tagName, branch] = release.split(':');
              if (!tagName || !branch) continue;

              try {
                // Check if release already exists
                await github.rest.repos.getReleaseByTag({ owner, repo, tag: tagName });
                core.info(`Release for ${tagName} already exists.`);
              } catch (e) {
                // Create a new release
                await github.rest.repos.createRelease({
                  owner, repo,
                  tag_name: tagName,
                  target_commitish: branch,
                  name: tagName,
                  body: `Automated Trusted Signatures release based on upstream ${tagName.replace(/-ts.*$/, '')}`,
                  draft: false,
                  prerelease: false
                });
                core.info(`Created release ${tagName}`);
              }

              // Trigger build workflow for this release
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner, repo,
                  workflow_id: 'build-tag.yml',
                  ref: 'main',
                  inputs: {
                    tag_name: tagName
                  }
                });
                core.info(`Triggered build workflow for ${tagName}`);
              } catch (e) {
                core.error(`Failed to trigger build workflow for ${tagName}: ${e.message}`);
              }
            }
